[build]
  command = "npm run build -w homeslate-hosted && node scripts/write-redirects.mjs"
  publish = "dist"

[functions]
  directory = "apps/hosted/netlify/functions"
  node_bundler = "esbuild"
  # @homeslate/* are ESM-only; bundling inlines them into CJS function output.
  # Stripe stays external — it ships dual CJS/ESM and is large.
  external_node_modules = ["stripe"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/api/billing/checkout"
  to = "/.netlify/functions/billing-checkout"
  status = 200

[[redirects]]
  from = "/api/billing/portal"
  to = "/.netlify/functions/billing-portal"
  status = 200

[[redirects]]
  from = "/api/billing/webhook"
  to = "/.netlify/functions/billing-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — must stay below /api/* so functions are not shadowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# GIS popup OAuth (initCodeClient ux_mode: popup) needs opener access to the popup.
# Without this, Chrome logs COOP warnings and sign-in can intermittently fail.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
