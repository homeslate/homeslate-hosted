[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — must be global [[redirects]]; context.* redirect tables are ignored
# by Netlify for netlify.toml (redirects are always global). Order: specific rules first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
