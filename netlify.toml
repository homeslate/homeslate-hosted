[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — must stay below /api/* so functions are not shadowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# GIS popup OAuth (initCodeClient ux_mode: popup) needs opener access to the popup.
# Without this, Chrome logs COOP warnings and sign-in can intermittently fail.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
